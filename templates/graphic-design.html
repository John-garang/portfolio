    <style>
        /* ── Gallery grid ── */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        /* ── Group card: no fixed height, no background fill ── */
        .design-item {
            position: relative;
            border-radius: 0;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            cursor: pointer;
        }

        /* Slide track clips to card width */
        .slide-track {
            display: flex;
            transition: transform 0.42s cubic-bezier(0.4,0,0.2,1);
            will-change: transform;
            align-items: flex-start;
        }

        .slide {
            min-width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Image fills its natural aspect ratio — zero letterboxing */
        .slide img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* ── Overlay: cover slide only ── */
        .design-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(0,0,0,0.82));
            color: #fff;
            padding: 2rem 1.5rem 1.2rem;
            transform: translateY(100%);
            transition: transform 0.3s ease, opacity 0.3s ease;
            opacity: 1;
            pointer-events: none;
        }

        .design-item.on-cover:hover .design-overlay { transform: translateY(0); }

        .design-item.on-gallery .design-overlay {
            transform: translateY(100%) !important;
            opacity: 0 !important;
        }

        .design-item.on-cover:hover .slide:first-child img {
            transform: scale(1.03);
            transition: transform 0.3s ease;
        }

        .design-overlay h3 { margin-bottom: 0.35rem; font-size: 1.1rem; }
        .design-overlay p  { margin: 0; opacity: 0.88; font-size: 0.85rem; }

        /* ── Arrows ── */
        .slide-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0,0,0,0.5);
            color: #fff;
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            font-size: 0.85rem;
            cursor: pointer;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, opacity 0.2s;
            opacity: 0;
            pointer-events: none;
        }
        .design-item:hover .slide-btn,
        .design-item:focus-within .slide-btn { opacity: 1; pointer-events: auto; }
        .slide-btn:hover { background: rgba(22,178,220,0.9); }
        .slide-btn.prev { left: 8px; }
        .slide-btn.next { right: 8px; }

        /* ── Dots ── */
        .slide-dots {
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 5px;
            z-index: 10;
        }
        .dot {
            width: 7px; height: 7px;
            border-radius: 50%;
            background: rgba(255,255,255,0.45);
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
            border: none;
            padding: 0;
        }
        .dot.active { background: #16b2dc; transform: scale(1.35); }

        /* ── Counter ── */
        .slide-counter {
            position: absolute;
            top: 10px; right: 10px;
            background: rgba(0,0,0,0.5);
            color: #fff;
            font-size: 0.72rem;
            padding: 3px 8px;
            border-radius: 20px;
            z-index: 10;
            font-family: 'Inter', sans-serif;
        }

        /* ── Mobile ── */
        @media (max-width: 600px) {
            .gallery-grid { grid-template-columns: 1fr; gap: 1.2rem; }
            .slide-btn { opacity: 1; pointer-events: auto; width: 34px; height: 34px; }
        }
        @media (min-width: 601px) and (max-width: 900px) {
            .gallery-grid { grid-template-columns: repeat(2, 1fr); }
        }

        // ── Build & mount cards ────────────────────────────────────────────
        function buildCard(group) {
            const item = document.createElement('div');
            item.className = 'design-item on-cover';
            item.dataset.current = '0';

            // Slide track
            const track = document.createElement('div');
            track.className = 'slide-track';

            group.slides.forEach((file, i) => {
                const slide = document.createElement('div');
                slide.className = 'slide';
                const img = document.createElement('img');
                img.src = BASE + file;
                img.alt = group.label + ' — slide ' + (i + 1);
                img.loading = i === 0 ? 'eager' : 'lazy';
                slide.appendChild(img);
                track.appendChild(slide);
            });

            // Overlay (cover state only)
            const overlay = document.createElement('div');
            overlay.className = 'design-overlay';
            overlay.innerHTML = '<h3>' + group.label + '</h3><p>' + group.desc + '</p>';

            // Counter
            const counter = document.createElement('div');
            counter.className = 'slide-counter';
            counter.textContent = '1 / ' + group.slides.length;

            // Prev / Next buttons
            const prev = document.createElement('button');
            prev.className = 'slide-btn prev';
            prev.setAttribute('aria-label', 'Previous');
            prev.innerHTML = '<i class="fas fa-chevron-left"></i>';

            const next = document.createElement('button');
            next.className = 'slide-btn next';
            next.setAttribute('aria-label', 'Next');
            next.innerHTML = '<i class="fas fa-chevron-right"></i>';

            // Dots (max 12 shown to avoid overflow)
            const dotsWrap = document.createElement('div');
            dotsWrap.className = 'slide-dots';
            const dotCount = Math.min(group.slides.length, 12);
            for (let d = 0; d < dotCount; d++) {
                const dot = document.createElement('button');
                dot.className = 'dot' + (d === 0 ? ' active' : '');
                dot.setAttribute('aria-label', 'Go to slide ' + (d + 1));
                dot.dataset.index = d;
                dotsWrap.appendChild(dot);
            }

            item.appendChild(track);
            item.appendChild(overlay);
            item.appendChild(counter);
            if (group.slides.length > 1) {
                item.appendChild(prev);
                item.appendChild(next);
                item.appendChild(dotsWrap);
            }

            // ── Navigation logic ──
            function goTo(idx) {
                const total = group.slides.length;
                idx = (idx + total) % total;
                item.dataset.current = idx;
                track.style.transform = 'translateX(-' + (idx * 100) + '%)';
                counter.textContent = (idx + 1) + ' / ' + total;

                // Overlay state
                if (idx === 0) {
                    item.classList.replace('on-gallery', 'on-cover');
                } else {
                    item.classList.replace('on-cover', 'on-gallery');
                }

                // Dots
                dotsWrap.querySelectorAll('.dot').forEach((d, i) => {
                    d.classList.toggle('active', i === idx);
                });
            }

            prev.addEventListener('click', e => { e.stopPropagation(); goTo(+item.dataset.current - 1); });
            next.addEventListener('click', e => { e.stopPropagation(); goTo(+item.dataset.current + 1); });
            dotsWrap.addEventListener('click', e => {
                const dot = e.target.closest('.dot');
                if (dot) { e.stopPropagation(); goTo(+dot.dataset.index); }
            });

            // Touch / swipe
            let touchX = null;
            item.addEventListener('touchstart', e => { touchX = e.touches[0].clientX; }, { passive: true });
            item.addEventListener('touchend', e => {
                if (touchX === null) return;
                const dx = e.changedTouches[0].clientX - touchX;
                if (Math.abs(dx) > 40) goTo(+item.dataset.current + (dx < 0 ? 1 : -1));
                touchX = null;
            });

            return item;
        }

        const grid = document.getElementById('galleryGrid');
        GROUPS.forEach(g => grid.appendChild(buildCard(g)));
