<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travels & Fun - John Ngor Deng Garang</title>
    <meta name="description" content="Travel stories and adventures by John Ngor Deng Garang — from Cape Town to Accra, exploring cultures, landscapes, and life across Africa.">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://johngarang.com/travels">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://johngarang.com/travels">
    <meta property="og:title" content="Travels & Fun | John Ngor Deng Garang">
    <meta property="og:description" content="Travel stories and adventures by John Ngor Deng Garang across Africa and beyond.">
    <meta property="og:image" content="https://johngarang.com/static/Pictures/john-ngor-deng-garang-travels.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Travels & Fun | John Ngor Deng Garang">
    <meta name="twitter:image" content="https://johngarang.com/static/Pictures/john-ngor-deng-garang-travels.png">
    <link rel="stylesheet" href="static/styles.css">
    <link rel="stylesheet" href="/static/loading.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Loading Screen -->
    <div class="loading-screen" id="loadingScreen">
        <div class="loading-content">
            <img src="/static/Pictures/john-ngor-deng-garang-logo.png" alt="JNDG" class="loading-logo">
            <p class="loading-text">Communications Professional</p>
        </div>
    </div>

    <div id="header-placeholder"></div>
    <script src="static/load-header.js"></script>

    <section class="shelf-hero">
        <div class="container">
            <h1>Travels & Fun</h1>
            <p class="shelf-subtitle">Adventures & Memories</p>
            <p class="shelf-description">Explore adventures, memories, and the joy of life's little moments.</p>
        </div>
    </section>

    <section class="posts-section">
        <div class="container">
            <div id="articlesGrid" class="article-cards-grid"></div>
        </div>
    </section>

    <div id="footer-placeholder"></div>
    <script src="static/load-footer.js"></script>

    <script>
        let allArticles = [];

        async function loadArticles() {
            try {
                const response = await fetch('https://portfolio-backend-1-53hz.onrender.com/api/articles');
                const articles = await response.json();
                allArticles = articles.filter(a => a.category === 'travels');
                displayArticles(allArticles);
            } catch (error) {
                document.getElementById('articlesGrid').innerHTML = '<div class="empty-state"><p>No articles available</p></div>';
            }
        }

        function displayArticles(articles) {
            const grid = document.getElementById('articlesGrid');
            if (articles.length === 0) {
                grid.innerHTML = '<div class="empty-state"><i class="fas fa-plane" style="font-size: 3rem; margin-bottom: 1rem;"></i><p>No travel stories yet</p></div>';
            } else {
                grid.innerHTML = articles.map(article => `
                    <div class="article-card" data-id="${article.id}" style="cursor: pointer;">
                        ${article.image ? `<div class="article-image"><img src="${article.image}" alt="${article.title}"></div>` : ''}
                        <div class="article-content">
                            <div class="article-meta">
                                <span class="article-category">${article.category}</span>
                                <span class="read-time"><i class="far fa-clock"></i> ${article.date}</span>
                            </div>
                            <h3>${article.title}</h3>
                            <p>${article.excerpt}</p>
                        </div>
                    </div>
                `).join('');
                
                document.querySelectorAll('.article-card').forEach(card => {
                    card.addEventListener('click', function() {
                        const id = this.getAttribute('data-id');
                        window.location.href = `article.html?id=${id}`;
                    });
                });
            }
        }

        loadArticles();
    </script>

    <script>
        // Set active page
        document.addEventListener('DOMContentLoaded', function() {
            const currentPage = window.location.pathname.split('/').pop() || 'index.html';
            document.querySelectorAll('.nav-link').forEach(link => {
                if (link.getAttribute('href') === currentPage) {
                    link.classList.add('active');
                }
            });
        });
    </script>
    <script src="/static/loading.js" defer></script>
</body>
</html>
