<!DOCTYPE html>
<html lang="en">
<head>

    <style>#loading-screen{position:fixed;inset:0;background:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:9999;transition:opacity .4s ease}.loading-logo{width:80px;height:auto;margin-bottom:1.5rem}.loading-bar-track{width:120px;height:2px;background:#e8e8e8;overflow:hidden}.loading-bar-fill{height:100%;width:40%;background:#16b2dc;animation:_ld 1s ease-in-out infinite}@keyframes _ld{0%{transform:translateX(-100%)}100%{transform:translateX(350%)}}</style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travels & Fun - John Ngor Deng Garang</title>
    <meta name="description" content="Travel stories and adventures by John Ngor Deng Garang — from Cape Town to Accra, exploring cultures, landscapes, and life across Africa.">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://johngarang.com/travels">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://johngarang.com/travels">
    <meta property="og:title" content="Travels & Fun | John Ngor Deng Garang">
    <meta property="og:description" content="Travel stories and adventures by John Ngor Deng Garang across Africa and beyond.">
    <meta property="og:image" content="https://johngarang.com/static/Pictures/john-ngor-deng-garang-travels.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Travels & Fun | John Ngor Deng Garang">
    <meta name="twitter:image" content="https://johngarang.com/static/Pictures/john-ngor-deng-garang-travels.png">
    <link rel="stylesheet" href="static/styles.css?v=1.2.0">
    <link rel="stylesheet" href="static/mobile-fixes.css">
    <link rel="stylesheet" href="/static/loading.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/theme.css?v=4.0.0">
</head>
<body>
    <!-- Loading Screen -->
    <div id="loading-screen" class="loading-screen">
        <img src="/static/Pictures/john-ngor-deng-garang-logo-sm.webp" alt="JNDG" class="loading-logo">
        <div class="loading-bar-track"><div class="loading-bar-fill"></div></div>
    </div>

    <div id="header-placeholder"></div>
    <script src="/static/load-header.js?v=2.1.0"></script>

    <section class="hx hx-japan hx-travel on-dark">
        <span class="jp-mark" aria-hidden="true"></span>
        <div class="container travel-grid">
            <div>
                <h1 class="jp-lines"><span class="erode">Travels &amp;</span><span>Fun</span></h1>
                <p class="jp-meta"><span class="erode-soft">Adventures &amp;</span><br><span class="fall">Memories</span></p>
                <div class="jp-foot"><p>Explore adventures, memories, and the joy of life's little moments.</p><span>johngarang.com</span></div>
            </div>
            <div class="polaroids" aria-label="Places"><figure class="polaroid p0"><img src="/static/Pictures/travel-cape-town.webp" alt="Group photo below Table Mountain, Cape Town" width="520" height="620"><figcaption>Cape Town</figcaption></figure><figure class="polaroid p1"><img src="/static/Pictures/travel-kigali.webp" alt="UNLEASH Global Innovation Lab stage in Kigali" width="520" height="620"><figcaption>Kigali</figcaption></figure><figure class="polaroid p2"><img src="/static/Pictures/travel-accra.webp" alt="Student cohort in Accra" width="520" height="620"><figcaption>Accra</figcaption></figure><figure class="polaroid p3"><img src="/static/Pictures/travel-nairobi.webp" alt="Hackathon space in Nairobi" width="520" height="620"><figcaption>Nairobi</figcaption></figure></div>
        </div>
    </section>

    <section class="posts-section">
        <div class="container">
            <div id="articlesGrid" class="article-cards-grid"></div>
        </div>
    </section>

    <div id="footer-placeholder"></div>
    <script src="static/load-footer.js?v=2.0.0" defer></script>
    <script src="static/brand-notifications.js" defer></script>
    <script src="static/email.min.js" defer onload="emailjs.init('jMid5j4K3IEfIlIr0')"></script>

    <script>
        let allArticles = [];

        async function loadArticles() {
            try {
                const response = await fetch('https://portfolio-backend-1-53hz.onrender.com/api/articles');
                const articles = await response.json();
                allArticles = articles.filter(a => a.category === 'travels');
                displayArticles(allArticles);
            } catch (error) {
                document.getElementById('articlesGrid').innerHTML = '<div class="empty-state"><p>No articles available</p></div>';
            }
        }

        function displayArticles(articles) {
            const grid = document.getElementById('articlesGrid');
            if (articles.length === 0) {
                grid.innerHTML = '<div class="empty-state"><i class="fas fa-plane" style="font-size: 3rem; margin-bottom: 1rem;"></i><p>No travel stories yet</p></div>';
            } else {
                grid.innerHTML = articles.map(article => `
                    <div class="article-card" data-id="${article.id}" style="cursor: pointer;">
                        ${article.image ? `<div class="article-image"><img src="${article.image}" alt="${article.title}"></div>` : ''}
                        <div class="article-content">
                            <div class="article-meta">
                                <span class="article-category">${article.category}</span>
                                <span class="read-time"><i class="far fa-clock"></i> ${article.date}</span>
                            </div>
                            <h3>${article.title}</h3>
                            <p>${article.excerpt}</p>
                        </div>
                    </div>
                `).join('');
                
                document.querySelectorAll('.article-card').forEach(card => {
                    card.addEventListener('click', function() {
                        const id = this.getAttribute('data-id');
                        window.location.href = `article.html?id=${id}`;
                    });
                });
            }
        }

        loadArticles();
    </script>

    <script>
        // Set active page
        document.addEventListener('DOMContentLoaded', function() {
            const currentPage = window.location.pathname.split('/').pop() || 'index.html';
            document.querySelectorAll('.nav-link').forEach(link => {
                if (link.getAttribute('href') === currentPage) {
                    link.classList.add('active');
                }
            });
        });
    </script>
    <script src="/static/loading.js" defer></script>
    <script src="/static/site.js?v=4.0.0" defer></script>
</body>
</html>
