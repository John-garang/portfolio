<!DOCTYPE html>
<html lang="en">
<head>
    <style>#loading-screen{position:fixed;inset:0;background:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:9999;transition:opacity .4s ease}.loading-logo{width:80px;height:auto;margin-bottom:1.5rem}.loading-bar-track{width:120px;height:2px;background:#e8e8e8;overflow:hidden}.loading-bar-fill{height:100%;width:40%;background:#16b2dc;animation:_ld 1s ease-in-out infinite}@keyframes _ld{0%{transform:translateX(-100%)}100%{transform:translateX(350%)}}</style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Articles | John Garang</title>
    <link rel="stylesheet" href="static/styles.css">
    <link rel="stylesheet" href="/static/loading.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <!-- Loading Screen -->
    <div id="loading-screen" class="loading-screen">
        <img src="/static/Pictures/john-ngor-deng-garang-logo-sm.webp" alt="JNDG" class="loading-logo">
        <div class="loading-bar-track"><div class="loading-bar-fill"></div></div>
    </div>

    <nav class="navbar" id="main-navbar">
                <div class="nav-container">
                    <div class="nav-logo">
                        <img src="/static/Pictures/john-ngor-deng-garang-logo.png" alt="John Garang Logo">
                        <span class="logo-name">John Ngor Deng Garang</span>
                    </div>
                    <ul class="nav-menu">
                        <li><a href="/" class="nav-link">Home</a></li>
                        <li><a href="/about" class="nav-link">About</a></li>
                        <li class="dropdown">
                            <a href="/work-portfolio" class="nav-link">Work Portfolio <i class="fas fa-chevron-down"></i></a>
                            <div class="dropdown-content">
                                <a href="/my-shelf">My Shelf</a>
                                <a href="/cv">CV</a>
                                <a href="/graphic-design">Graphic Design</a>
                                <a href="/web-design">Web Design</a>
                            </div>
                        </li>
                        <li><a href="/experience-overview" class="nav-link">Experience</a></li>
                        <li><a href="/programs-overview" class="nav-link">Programs</a></li>
                        <li><a href="/services" class="nav-link">Services</a></li>
                        <li><a href="/poems" class="nav-link">Poems</a></li>
                    </ul>
                    <div class="nav-right">
                        <div class="hamburger" id="hamburger">
                            <span></span>
                            <span></span>
                            <span></span>
                        </div>
                    </div>
                </div>
                <div class="mobile-overlay" id="mobileOverlay"></div>
            </nav>
    <script src="/static/load-header.js"></script>

    <section class="blog-hero">
        <div class="container">
            <h1>My Articles</h1>
            <p>Thoughts, insights, and stories from my journey</p>
        </div>
    </section>

    <section class="blog-posts">
        <div class="container">
            <div id="articles-container" class="posts-grid">
                <div class="loading">Loading articles...</div>
            </div>
        </div>
    </section>

    <script>
        async function loadArticles() {
            try {
                const response = await fetch('https://portfolio-backend-1-53hz.onrender.com/api/articles');
                const articles = await response.json();
                
                const container = document.getElementById('articles-container');
                
                if (articles.length === 0) {
                    container.innerHTML = '<div class="no-posts"><p>No articles available yet.</p></div>';
                    return;
                }
                
                container.innerHTML = articles.map(article => `
                    <article class="post-card" data-id="${article.id}" style="cursor: pointer;">
                        <div class="post-content">
                            <div class="post-meta">
                                <span class="post-date">${article.date}</span>
                                <span class="post-category">${article.category}</span>
                            </div>
                            <h2 class="post-title">${article.title}</h2>
                            <p class="post-excerpt">${article.excerpt}</p>
                            <a href="article?id=${article.id}" class="read-more">Read More <i class="fas fa-arrow-right"></i></a>
                        </div>
                    </article>
                `).join('');
                
                document.querySelectorAll('.post-card').forEach(card => {
                    card.addEventListener('click', function(e) {
                        if (!e.target.closest('.read-more')) {
                            const id = this.getAttribute('data-id');
                            window.location.href = `article.html?id=${id}`;
                        }
                    });
                });
            } catch (error) {
                document.getElementById('articles-container').innerHTML = 
                    '<div class="no-posts"><p>Error loading articles. Please make sure the server is running.</p></div>';
            }
        }

        loadArticles();
    </script>

    <script>
        // Set active page
        document.addEventListener('DOMContentLoaded', function() {
            const currentPage = window.location.pathname.split('/').pop() || 'index.html';
            document.querySelectorAll('.nav-link').forEach(link => {
                if (link.getAttribute('href') === currentPage) {
                    link.classList.add('active');
                }
            });
        });
    </script>
    <script src="/static/loading.js" defer></script>
</body>
</html>
