<!DOCTYPE html>
<html lang="en">
<head>
    <style>#loading-screen{position:fixed;inset:0;background:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:9999;transition:opacity .4s ease}.loading-logo{width:80px;height:auto;margin-bottom:1.5rem}.loading-bar-track{width:120px;height:2px;background:#e8e8e8;overflow:hidden}.loading-bar-fill{height:100%;width:40%;background:#16b2dc;animation:_ld 1s ease-in-out infinite}@keyframes _ld{0%{transform:translateX(-100%)}100%{transform:translateX(350%)}}</style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">

    <meta http-equiv="X-XSS-Protection" content="1; mode=block">
    <title>Article - John Garang</title>
    <link rel="stylesheet" href="static/styles.css">
    <link rel="stylesheet" href="static/mobile-fixes.css">
    <link rel="stylesheet" href="/static/loading.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Loading Screen -->
    <div id="loading-screen" class="loading-screen">
        <img src="/static/Pictures/john-ngor-deng-garang-logo-sm.webp" alt="JNDG" class="loading-logo">
        <div class="loading-bar-track"><div class="loading-bar-fill"></div></div>
    </div>

    <nav class="navbar" id="main-navbar">
                <div class="nav-container">
                    <div class="nav-logo">
                        <img src="/static/Pictures/john-ngor-deng-garang-logo.png" alt="John Garang Logo">
                        <span class="logo-name">John Ngor Deng Garang</span>
                    </div>
                    <ul class="nav-menu">
                        <li><a href="/" class="nav-link">Home</a></li>
                        <li><a href="/about" class="nav-link">About</a></li>
                        <li class="dropdown">
                            <a href="/work-portfolio" class="nav-link">Work Portfolio <i class="fas fa-chevron-down"></i></a>
                            <div class="dropdown-content">
                                <a href="/my-shelf">My Shelf</a>
                                <a href="/cv">CV</a>
                                <a href="/graphic-design">Graphic Design</a>
                                <a href="/web-design">Web Design</a>
                            </div>
                        </li>
                        <li><a href="/experience-overview" class="nav-link">Experience</a></li>
                        <li><a href="/programs-overview" class="nav-link">Programs</a></li>
                        <li><a href="/services" class="nav-link">Services</a></li>
                        <li><a href="/poems" class="nav-link">Poems</a></li>
                    </ul>
                    <div class="nav-right">
                        <div class="hamburger" id="hamburger">
                            <span></span>
                            <span></span>
                            <span></span>
                        </div>
                    </div>
                </div>
                <div class="mobile-overlay" id="mobileOverlay"></div>
            </nav>
    <script src="/static/load-header.js"></script>

    <section class="blog-header" id="articleHeader">
        <div class="container">
            <h1 id="articleTitle"></h1>
            <div class="blog-meta">
                <span class="author"><i class="fas fa-user"></i> John Garang</span>
                <span class="date" id="articleDate"></span>
                <span class="category" id="articleCategory"></span>
            </div>
        </div>
    </section>

    <section class="blog-content">
        <div class="container">
            <div class="blog-text" id="articleContent"></div>
            
            <div class="comments-section">
                <h2>Comments</h2>
                <form id="commentForm" class="comment-form" onsubmit="submitComment(event)">
                    <input type="text" id="commentName" placeholder="Your Name" required>
                    <textarea id="commentText" placeholder="Your Comment" rows="4" required></textarea>
                    <button type="submit">Post Comment</button>
                </form>
                <div id="commentsList"></div>
            </div>
        </div>
    </section>

    <div id="footer-placeholder"></div>
    <script src="static/load-footer.js" defer></script>
    <script src="static/brand-notifications.js" defer></script>
    <script src="static/email.min.js" defer onload="emailjs.init('jMid5j4K3IEfIlIr0')"></script>

    <script>
        let articleId;
        let replyToId = null;

        async function loadArticle() {
            const urlParams = new URLSearchParams(window.location.search);
            articleId = urlParams.get('id');

            if (!articleId) {
                window.location.href = 'blog.html';
                return;
            }

            try {
                const response = await fetch(`https://portfolio-backend-1-53hz.onrender.com/api/articles/${articleId}`);
                const article = await response.json();

                document.getElementById('articleTitle').textContent = article.title;
                document.getElementById('articleDate').innerHTML = `<i class="fas fa-calendar"></i> ${article.date}`;
                document.getElementById('articleCategory').innerHTML = `<i class="fas fa-tag"></i> ${article.category}`;
                document.getElementById('articleContent').innerHTML = article.content.replace(/\n/g, '<br>');
                document.title = `${article.title} - John Garang`;
                
                loadComments();
            } catch (error) {
                document.getElementById('articleContent').innerHTML = '<p>Article not found</p>';
            }
        }

        async function loadComments() {
            try {
                const response = await fetch(`https://portfolio-backend-1-53hz.onrender.com/api/articles/${articleId}/comments`);
                const comments = await response.json();
                displayComments(comments);
            } catch (error) {
                console.error('Error loading comments:', error);
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function displayComments(comments) {
            const list = document.getElementById('commentsList');
            const topLevel = comments.filter(c => !c.parentId);
            
            list.innerHTML = topLevel.map(comment => {
                const replies = comments.filter(c => c.parentId === comment.id);
                const safeName = escapeHtml(comment.name);
                const safeText = escapeHtml(comment.text);
                return `
                    <div class="comment">
                        <div class="comment-header">
                            <strong>${safeName}</strong>
                            <span class="comment-date">${new Date(comment.date).toLocaleDateString()}</span>
                        </div>
                        <p>${safeText}</p>
                        <button class="reply-btn" onclick="setReply(${comment.id}, '${safeName.replace(/'/g, "\\'")}')">                            <i class="fas fa-reply"></i> Reply
                        </button>
                        ${replies.length ? `
                            <div class="replies">
                                ${replies.map(reply => `
                                    <div class="comment reply">
                                        <div class="comment-header">
                                            <strong>${escapeHtml(reply.name)}</strong>
                                            <span class="comment-date">${new Date(reply.date).toLocaleDateString()}</span>
                                        </div>
                                        <p>${escapeHtml(reply.text)}</p>
                                    </div>
                                `).join('')}
                            </div>
                        ` : ''}
                    </div>
                `;
            }).join('');
        }

        function setReply(commentId, name) {
            replyToId = commentId;
            document.getElementById('commentText').placeholder = `Replying to ${name}...`;
            document.getElementById('commentText').focus();
        }

        async function submitComment(e) {
            e.preventDefault();
            const name = document.getElementById('commentName').value;
            const text = document.getElementById('commentText').value;
            
            try {
                const response = await fetch(`https://portfolio-backend-1-53hz.onrender.com/api/articles/${articleId}/comments`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, text, parentId: replyToId })
                });
                
                if (response.ok) {
                    document.getElementById('commentForm').reset();
                    document.getElementById('commentText').placeholder = 'Your Comment';
                    replyToId = null;
                    loadComments();
                } else {
                    alert('Failed to post comment');
                }
            } catch (error) {
                alert('Error posting comment. Make sure server is running.');
            }
        }

        loadArticle();
    </script>

    <script>
        // Set active page
        document.addEventListener('DOMContentLoaded', function() {
            const currentPage = window.location.pathname.split('/').pop() || 'index.html';
            document.querySelectorAll('.nav-link').forEach(link => {
                if (link.getAttribute('href') === currentPage) {
                    link.classList.add('active');
                }
            });
        });
    </script>
    <script src="/static/loading.js" defer></script>
</body>
</html>
